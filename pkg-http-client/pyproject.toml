[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-http-client"
version = "0.2.4"
description = "HTTP/cURL wrapper for AI agents calling REST APIs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "httpx>=0.27.0",
]

[project.scripts]
agent-curl = "agent_http_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
