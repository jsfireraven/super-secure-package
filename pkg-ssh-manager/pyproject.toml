[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ssh-manager"
version = "0.1.8"
description = "SSH remote command execution for AI agent DevOps workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "paramiko>=3.4.0",
    "scp>=0.14.0",
]

[project.scripts]
agent-ssh = "agent_ssh_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
